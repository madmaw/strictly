# Deploys all packages to NPM
# to run locally `act workflow_dispatch --workflows ".\.github\workflows\workflow_call_npm.yaml"-s NPM_TOKEN=X`

name: NPM

on:
  workflow_call: ~
  workflow_dispatch: ~

jobs:
  all:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - name: Run install
        run: pnpm install --frozen-lockfile
      - name: Run build
        run: pnpm build
      - name: Publish packages
        # pnpm applies each package's publishConfig (main, types, exports) and rewrites workspace:/catalog:
        # specifiers when packing, so no manifest rewriting is needed. Versions already on the registry are
        # skipped so this workflow can run on every push to main.
        run: |
          for package in packages/base packages/define packages/react-form; do
            name=$(node -p "require('./${package}/package.json').name")
            version=$(node -p "require('./${package}/package.json').version")
            if npm view "${name}@${version}" version > /dev/null 2>&1; then
              echo "${name}@${version} is already published, skipping"
            else
              echo "publishing ${name}@${version}"
              pnpm --filter "${name}" publish --provenance --access public --no-git-checks
            fi
          done
