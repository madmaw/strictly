# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # one PR per week for everything that stays within the declared ranges, and one per major so the lockfile only
    # has to be rebased once rather than once per package
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
