# do not hoist to .pnpm directory however as typescript cannot find type definitions if we do
hoist: false
# packages are published as external libraries, so peers are declared explicitly rather than auto-installed
autoInstallPeers: false
# mantine, lingui and react all use global values which break when multiple instances of the library are installed in
# individual package node_modules folders, so hoist everything into the root node_modules
nodeLinker: hoisted

packages:
  - apps/*
  - packages/*
  - support/*

# pinned versions previously enforced via yarn "resolutions"
overrides:
  react: 19.3.0
  react-dom: 19.3.0
  # the mock bundles its own vitest, keep it on the same copy the tests run under
  'vitest-matchmedia-mock>vitest': $vitest
  # vite plus ships its own vite build under the vite name and pins the vitest it bundles, so every request in the
  # tree, including astro's, resolves to those copies
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

peerDependencyRules:
  allowedVersions:
    # the storybook vitest addon still declares vitest 3 and 4 but runs every story on 5; storybook 11 widens the range
    '@storybook/addon-vitest>@vitest/browser-playwright': '5'
    '@storybook/addon-vitest>vitest': '5'
    # the vite alias does not satisfy any published peer range
    vite: '*'
    vitest: '*'
    # storybook still declares the pre release vite plus range
    '@storybook/*>vite-plus': '1'
    'storybook>vite-plus': '1'
  allowAny:
    - vite
    - vitest

catalog:
  '@astrojs/mdx': ^8.0.2
  '@astrojs/react': ^7.0.0
  '@babel/core': ^8.0.6
  '@babel/plugin-transform-class-properties': ^8.0.1
  '@babel/plugin-proposal-decorators': ^8.0.2
  '@babel/plugin-transform-class-static-block': ^8.0.5
  '@lingui/babel-plugin-lingui-macro': ^6.8.0
  '@lingui/cli': ^6.8.0
  '@lingui/conf': ^6.8.0
  '@lingui/core': ^6.8.0
  '@lingui/react': ^6.8.0
  '@lingui/vite-plugin': ^6.8.0
  '@mantine/core': ^9.0.0
  '@microsoft/api-extractor': ^7.59.2
  '@mantine/hooks': ^9.0.0
  '@chromatic-com/storybook': ^5.3.1
  '@storybook/addon-docs': ^10.6.0
  '@storybook/addon-links': ^10.6.0
  '@storybook/addon-vitest': ^10.6.0
  '@storybook/react': ^10.6.0
  '@storybook/react-vite': ^10.6.0
  '@testing-library/dom': ^10.4.0
  '@testing-library/react': ^16.0.1
  '@testing-library/user-event': ^14.5.2
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.2.0
  # typescript 7 ships the native compiler without a javascript api, so typescript-eslint and vite-plugin-dts still
  # need the typescript 6 api under the typescript package name
  '@typescript/native': npm:typescript@^7.0.2
  '@rolldown/plugin-babel': ^0.2.4
  '@vitejs/plugin-react': ^6.1.1
  '@vitest/browser-playwright': 5.0.1
  astro: ^7.3.5
  jsdom: ^30.1.1
  mobx: ^7.0.0
  mobx-react: ^10.0.0
  playwright: ^1.49.1
  react: ^19.2.0
  react-dom: ^19.2.0
  resize-observer-polyfill: ^1.5.1
  storybook: ^10.6.0
  type-fest: ^5.0.0
  typescript: npm:@typescript/typescript6@^6.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plugin-dts: ^5.1.1
  vitest: 5.0.1
  vitest-fail-on-console: ^0.10.1
  vitest-matchmedia-mock: ^2.0.4
  vitest-mock-extended: ^5.1.1
  vite-plus: 1.0.0
  zod: ^4.0.0

# run every script under this exact node version regardless of the machine's install
useNodeVersion: 22.23.3
