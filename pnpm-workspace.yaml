# do not hoist to .pnpm directory however as typescript cannot find type definitions if we do
hoist: false
# packages are published as external libraries, so peers are declared explicitly rather than auto-installed
autoInstallPeers: false
# mantine, lingui and react all use global values which break when multiple instances of the library are installed in
# individual package node_modules folders, so hoist everything into the root node_modules
nodeLinker: hoisted

packages:
  - apps/*
  - packages/*
  - support/*

# pinned versions previously enforced via yarn "resolutions"
overrides:
  react: 19.1.0
  react-dom: 19.1.0
  # the mock bundles its own vitest, keep it on the same copy the tests run under
  'vitest-matchmedia-mock>vitest': $vitest

catalog:
  '@astrojs/mdx': ^8.0.2
  '@astrojs/react': ^7.0.0
  '@babel/core': ^7.29.0
  '@babel/plugin-proposal-class-properties': ^7.18.6
  '@babel/plugin-proposal-decorators': ^7.25.9
  '@babel/plugin-transform-class-static-block': ^7.26.0
  '@lingui/babel-plugin-lingui-macro': ^6.8.0
  '@lingui/cli': ^6.8.0
  '@lingui/core': ^6.8.0
  '@lingui/react': ^6.8.0
  '@lingui/vite-plugin': ^6.8.0
  '@mantine/core': ^8.1.2
  '@microsoft/api-extractor': ^7.59.2
  '@mantine/hooks': ^8.1.2
  '@chromatic-com/storybook': ^5.3.1
  '@storybook/addon-docs': ^10.6.0
  '@storybook/addon-links': ^10.6.0
  '@storybook/addon-vitest': ^10.6.0
  '@storybook/react': ^10.6.0
  '@storybook/react-vite': ^10.6.0
  '@testing-library/dom': ^10.4.0
  '@testing-library/react': ^16.0.1
  '@testing-library/user-event': ^14.5.2
  '@types/react': ^19.0.0
  '@types/react-dom': ^19.0.0
  # typescript 7 ships the native compiler without a javascript api, so typescript-eslint and vite-plugin-dts still
  # need the typescript 6 api under the typescript package name
  '@typescript/native': npm:typescript@^7.0.2
  '@rolldown/plugin-babel': ^0.2.4
  '@types/babel__core': ^7.20.5
  '@vitejs/plugin-react': ^6.1.1
  '@vitest/browser-playwright': ^4.1.11
  astro: ^7.3.5
  jsdom: ^25.0.1
  mobx: ^6.13.5
  mobx-react: ^9.1.1
  playwright: ^1.49.1
  react: ^19.0.0
  react-dom: ^19.0.0
  resize-observer-polyfill: ^1.5.1
  storybook: ^10.6.0
  type-fest: ^4.27.0
  typescript: npm:@typescript/typescript6@^6.0.2
  vite: ^8.3.1
  vite-plugin-dts: ^5.1.1
  vite-tsconfig-paths: ^6.1.1
  vitest: ^4.1.11
  vitest-matchmedia-mock: ^2.0.4

# run every script under this exact node version regardless of the machine's install
useNodeVersion: 22.20.0
